# Ticker changes for the S&P 500 universe (q5, REQ-553): the ticker Wikipedia's
# table of changes used at the time -> the ticker the company trades under today,
# which is the one Tiingo files its whole price history under. At the end, the
# former members Tiingo has no prices of (not_in_source, #104).
#
# `uv run quantlab build-universe` lists every addition of a ticker that is not
# in the index afterwards; most are renames missing here. Add them, rebuild, and
# commit this file with sp500.yaml. A ticker another company used before or after
# goes to dated_renames with the window of changes it covers, never to renames.
#
# Entries below come from the build report of 2026-09-28 (revisions 1375923233 and
# 1376064088); each one is an addition the report listed, or a ticker change the
# table records as an addition and a removal.
renames:
  FB: META  # Facebook -> Meta Platforms, 2022-06-09
  LUK: JEF  # Leucadia National -> Jefferies Financial Group, 2018
  TSO: ANDV  # Tesoro -> Andeavor, 2017 (acquired by Marathon Petroleum, 2018)
  JEC: J  # Jacobs Engineering, ticker J since 2019
  COG: CTRA  # Cabot Oil & Gas -> Coterra Energy, 2021
  HRS: LHX  # Harris -> L3Harris Technologies, 2019
  PCLN: BKNG  # Priceline Group -> Booking Holdings, 2018
  JOYG: JOY  # Joy Global, NYSE ticker JOY from 2011
  DLPH: APTV  # Delphi Automotive -> Aptiv, 2017
  KORS: CPRI  # Michael Kors Holdings -> Capri Holdings, 2019
  RE: EG  # Everest Re Group -> Everest Group, 2023
  FLT: CPAY  # FleetCor Technologies -> Corpay, 2024
  SATS: ECHO  # EchoStar, ticker ECHO since 2026 (the list dates ECHO to SATS's addition)
  WLTW: WTW  # Willis Towers Watson, ticker WTW since 2022-01-10

dated_renames:
  # Under Armour class A traded as UA until the class C shares took UA in April 2016.
  - {ticker: UA, to: UAA, until: 2016-04-07}
  # Ingersoll-Rand plc became Trane Technologies (TT) in March 2020; IR is Gardner
  # Denver's (Ingersoll Rand Inc.) since.
  - {ticker: IR, to: TT, until: 2020-02-29}
  # QuintilesIMS traded as Q in 2017 before IQV; Q was Qwest's until 2011 and is
  # Qnity Electronics' since 2025 (the second build reported Qnity renamed to IQV).
  - {ticker: Q, to: IQV, from: 2017-01-01, until: 2017-12-31}

# Former members whose ticker Tiingo files another company's whole price history
# under (#104): a ticker another company took over, which no rename can reach,
# since Tiingo keeps one company per ticker. The lab asks Tiingo nothing about them,
# so they stay members priced nowhere and the coverage report lists them. Only
# cases `uv run quantlab audit-tickers` flags and a review confirms go here, each
# with its evidence in a comment; then rebuild the universe and commit both files.
# Quote a ticker YAML would read as a boolean ('ON', 'NO', 'Y').
#
# Entries below come from the review of the xsmom_v1 audit of 2026-10-03..05
# (Tiingo metadata as asked then). The audit table with the price medians stays
# local (results/ticker-audit-xsmom_v1.csv), as it is computed from Tiingo prices.
not_in_source:
  # Alcoa Inc. (member to 2016-10-31): Tiingo's AA is Alcoa Corp, the 2016 spin-off,
  # from 2016-10-18 (when-issued); its last 10 member sessions are the spin-off's,
  # below Alcoa Inc.'s price (around $30) and at a small fraction of its volume.
  - AA
  # Discovery class A (member to 2022-04-10, ticker WBD from 2022-04-11): Tiingo
  # gives DISCA no name and a history of 2022-04-08..2022-09-16 only, which matches
  # neither company; excluded as ambiguous (one member session, in the holdout).
  - DISCA
  # El Paso Corp (member to 2012-05-16): Tiingo's EP is Empire Petroleum, from
  # 2011-02-23; prices of a few cents and no volume on about half the sessions,
  # where El Paso traded around $10-35.
  - EP
  # Genzyme (member to 2011-03-31): Tiingo's GENZ is a VanEck ETF, from 2008-01-24;
  # almost no volume, where Genzyme was a large cap trading around $50-80.
  - GENZ
  # LSI Corp (member to 2014-05-07): Tiingo's LSI is Life Storage (Sovran),
  # 1995-06-21..2023-07-19; prices at Life Storage's level, where LSI Corp traded
  # around $3-15.
  - LSI
  # Millipore (member to 2010-07-13): Tiingo's MIL is MFC Industrial,
  # 1996-05-08..2016-02-12; thin volume and one-day moves of +607% (2009-11-16) and
  # +737% (2010-05-06), where Millipore traded around $60-100.
  - MIL
  # Sunoco Inc. (member to 2012-10-09): Tiingo's SUN is Sunoco LP, from its listing
  # as Susser Petroleum Partners on 2012-09-20; its last 14 member sessions are the
  # partnership's, at half Sunoco Inc.'s price (around $47-50).
  - SUN

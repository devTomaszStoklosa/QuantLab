# A static basket of broad US-listed ETFs across asset classes (q12, REQ-1230),
# frozen before any run reads its data, as pre-registration question 1 decided on
# 2026-09-26. One to three ETFs a class, each trading since 2007 or earlier and
# chosen for breadth and liquidity, not for results: all still trade today, a
# survivorship caveat the research log records.
#
# Cash is BIL (1-3 month Treasury bills): its dividend-adjusted closes are the
# rate cash earns, so every return of a run on this universe is a return above
# cash (q12, REQ-1212). It is never a member and never traded; returns above
# cash start at its first bar (it listed in May 2007).
name: multiasset-etf
source: tiingo
periods_per_year: 252  # NYSE sessions
market_proxy: spy
asof_date: "2026-09-26"
cash:
  id: bil
  symbol: BIL
  asset_class: cash
  quote_asset: USD
instruments:
  # Equities: US large caps, developed markets ex-US, emerging markets.
  - id: spy
    symbol: SPY
    asset_class: equity
    quote_asset: USD
  - id: efa
    symbol: EFA
    asset_class: equity
    quote_asset: USD
  - id: eem
    symbol: EEM
    asset_class: equity
    quote_asset: USD
  # Bonds: 7-10 and 20+ year Treasuries, investment-grade corporates.
  - id: ief
    symbol: IEF
    asset_class: bond
    quote_asset: USD
  - id: tlt
    symbol: TLT
    asset_class: bond
    quote_asset: USD
  - id: lqd
    symbol: LQD
    asset_class: bond
    quote_asset: USD
  # Commodities: gold, a broad futures index.
  - id: gld
    symbol: GLD
    asset_class: commodity
    quote_asset: USD
  - id: dbc
    symbol: DBC
    asset_class: commodity
    quote_asset: USD
  # Currency: the US dollar against a basket of majors.
  - id: uup
    symbol: UUP
    asset_class: currency
    quote_asset: USD
  # Real estate: US REITs.
  - id: vnq
    symbol: VNQ
    asset_class: real_estate
    quote_asset: USD

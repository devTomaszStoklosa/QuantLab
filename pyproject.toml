[project]
name = "quantlab"
version = "0.1.0"
description = "Systematic investment research platform: hypothesis, data, signal, backtest, validation."
authors = [
    { name = "Tomasz", email = "tomaszstoklosa1990@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "typer>=0.27.2",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

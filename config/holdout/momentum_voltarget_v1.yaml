# Frozen definition of time-series momentum scaled to a target volatility (q11,
# REQ-1120). Committed before any run of this hypothesis reads market data: it is
# the single source of its parameters, dates and success criterion. Do not edit:
# a change after this commit makes it a different hypothesis.
# frozen_at_commit is read from git (the last commit touching this file).
#
# The signal is momentum_v1's (sign of the 365-day return, daily rebalancing);
# only the position size differs. Each instrument's equal-weight share is
# multiplied by min(1, 0.40 / annualized ex-ante volatility), the volatility being
# exponentially weighted with a 60-day center of mass over the last 365 daily
# returns up to the decision day (Moskowitz, Ooi, Pedersen 2012; the window is
# finite so an estimate never depends on where the fetched data starts). The cap
# of 1 means no leverage: the engines charge no financing cost. With crypto
# volatility usually above 40% a year, the scaling mostly cuts exposure in
# turbulent periods.
#
# The idea came after reading momentum_v1's results (all of its training gain in
# medium volatility, a -88.7% drawdown), so this is a new trial on mvp-crypto
# 2018-2023 and counts in the deflated Sharpe of every trial on those data.
# 2024-2025 is momentum_v1's opened holdout; this holdout is data no run on
# mvp-crypto had read when this file was committed, about 8 months, so the test
# has little power - accepted upfront, as for the other crypto hypotheses.
hypothesis: momentum_voltarget_v1

training_start: 2018-01-01
training_end: 2023-12-31
start: 2026-01-01
end: 2026-08-31

parameters:
  strategy: time_series_momentum_vol_target
  lookback_days: 365
  target_volatility: 0.40
  max_scale: 1.0
  volatility:
    estimator: ewma
    center_of_mass_days: 60
    window_days: 365
  universe: mvp-crypto
  cost_model:
    name: realistic
    fee_bps: 10
    k: 0.05
    vol_window: 30

success_criterion:
  description: >-
    Holdout net Sharpe under the realistic cost model > 0 and permutation-test
    p-value < 0.1. Sharpe <= 0 -> rejected; Sharpe > 0 and p >= 0.1 ->
    inconclusive; Sharpe > 0 and p < 0.1 -> passed.
  min_sharpe: 0.0
  max_p_value: 0.1

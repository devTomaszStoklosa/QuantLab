# Frozen definition of the short-term reversal hypothesis (q3, REQ-331).
# Committed before any run of this hypothesis reads market data: it is the
# single source of its parameters, dates and success criterion. Do not edit:
# a change after this commit makes it a different hypothesis.
# frozen_at_commit is read from git (the last commit touching this file).
#
# Training is momentum_v1's period, so the two are compared on identical data.
# 2024-2025 is left out: q1 already looked at it. The holdout is data no run
# had read when this file was committed; about 8 months, so the test has
# little power - accepted upfront.
hypothesis: mean_reversion_v1

training_start: 2018-01-01
training_end: 2023-12-31
start: 2026-01-01
end: 2026-08-31

parameters:
  strategy: short_term_reversal
  formation_days: 7
  universe: mvp-crypto
  cost_model:
    name: realistic
    fee_bps: 10
    k: 0.05
    vol_window: 30

success_criterion:
  description: >-
    Holdout net Sharpe under the realistic cost model > 0 and permutation-test
    p-value < 0.1. Sharpe <= 0 -> rejected; Sharpe > 0 and p >= 0.1 ->
    inconclusive; Sharpe > 0 and p < 0.1 -> passed.
  min_sharpe: 0.0
  max_p_value: 0.1
